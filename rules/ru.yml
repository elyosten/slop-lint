- id: ru-001
  lang: ru
  type: regex
  pattern: 'важно отметить,? что'
  severity: warn
  message: Вводная фраза откладывает основной факт.
  suggest: Начните предложение с самого факта.
  tags: [filler]
  examples:
    bad: Важно отметить, что рынок растёт.
    good: Рынок растёт.
- id: ru-002
  lang: ru
  type: regex
  pattern: 'стоит отметить,? что'
  severity: warn
  message: Вводная фраза не объясняет значимость факта.
  suggest: Удалите вводную фразу или объясните значимость.
  tags: [filler]
  examples:
    bad: Стоит отметить, что сборка ускорилась.
    good: Сборка ускорилась вдвое.
- id: ru-003
  lang: ru
  type: phrase
  pattern: в современном быстро меняющемся мире
  severity: warn
  message: Общее вступление без контекста.
  suggest: Назовите конкретное изменение и его последствия.
  tags: [opening]
  examples:
    bad: В современном быстро меняющемся мире данные важны.
    good: Без истории заказов нельзя рассчитать повторные продажи.
- id: ru-004
  lang: ru
  type: phrase
  pattern: подводя итоги вышесказанного
  severity: warn
  message: Шаблонное объявление заключения.
  suggest: Сформулируйте вывод напрямую.
  tags: [conclusion]
  examples:
    bad: Подводя итоги вышесказанного, выберем второй вариант.
    good: Выберем второй вариант, потому что он дешевле.
- id: ru-005
  lang: ru
  type: phrase
  pattern: открывает новые горизонты
  severity: info
  message: Метафора не называет конкретные возможности.
  suggest: Укажите, что теперь можно сделать.
  tags: [vague]
  examples:
    bad: Этот инструмент открывает новые горизонты.
    good: Инструмент проверяет документацию перед публикацией.
